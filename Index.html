<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analog Clock</title>
</head>
<body>
    <div class="container">
        <div class="clock">

            <div  id ="hour" style="--clr: rgb(64, 64, 224); --h:130px;" class="hand"><i></i></div>
            <div  id ="mint" style="--clr: rgb(11, 176, 49); --h:150px;" class="hand"><i></i></div>
            <div  id ="sec" style="--clr: rgb(211, 94, 94); --h:170px;" class="hand"><i></i></div>
            
            <span style="--i:1;"><b>1</b></span>
            <span style="--i:2;"><b>2</b></span>
            <span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span>
            <span style="--i:5;"><b>5</b></span>
            <span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span>
            <span style="--i:8;"><b>8</b></span>
            <span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span>
            <span style="--i:11;"><b>11</b></span>
            <span style="--i:12;"><b>12</b></span>
        </div>
    </div>
    <h1 id="sh" style="color: rgb(179, 28, 101);">Designed & Developed by Shiv Prakash Chaudhary ❤️</h1>
    <script src="script.js"></script>
    </html>
</body>
